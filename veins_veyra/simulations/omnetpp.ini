#
# VEYRA Phase 3a - SUMO cars talking to 3 RSUs over 802.11p (Veins),
# each RSU bridged to one gateway in gateway_service.py.
#
# Before running:  1) veins_launchd (SUMO)   2) python gateway_service.py --vehicles 20
# Then:            ./run -u Cmdenv            (or ./run for the GUI)
# See PHASE3A.md in the VEYRA folder.
#

[General]
network = VeyraScenario
cmdenv-express-mode = true
cmdenv-autoflush = true
cmdenv-status-frequency = 20s
**.cmdenv-log-level = warn
debug-on-errors = false
print-undisposed = false

sim-time-limit = 240s
seed-set = ${runnumber}

# OMNeT++'s own statistics (.sca/.vec) go to simulations/results/.
# The VEYRA CSV and the gateway summary go to VEYRA/results/omnet-run-<time>/.
**.scalar-recording = true
*.rsu[*].appl.**.vector-recording = true
*.node[*].appl.**.vector-recording = true
**.vector-recording = false

*.playgroundSizeX = 2500m
*.playgroundSizeY = 2500m
*.playgroundSizeZ = 50m

##########################################################
# Map, buildings, SUMO                                   #
##########################################################
*.annotations.draw = true
*.obstacles.obstacles = xmldoc("config.xml", "//AnalogueModel[@type='SimpleObstacleShadowing']/obstacles")

*.manager.updateInterval = 0.1s
*.manager.host = "localhost"
*.manager.port = 9999
*.manager.autoShutdown = true
*.manager.launchConfig = xmldoc("erlangen.launchd.xml")

##########################################################
# RSUs: spread evenly along the Erlangen route           #
# (1/6, 3/6, 5/6 of its 3.4 km; same rule as             #
# sumo_driver.py, converted to OMNeT++ coordinates)      #
##########################################################
*.numRsus = 3
*.rsu[0].mobility.x = 2442.1
*.rsu[0].mobility.y = 2034.9
*.rsu[0].mobility.z = 3
*.rsu[1].mobility.x = 1605.1
*.rsu[1].mobility.y = 1540.9
*.rsu[1].mobility.z = 3
*.rsu[2].mobility.x = 539.1
*.rsu[2].mobility.y = 1242.7
*.rsu[2].mobility.z = 3

*.rsu[*].applType = "veyra.VeyraRsuApp"
*.rsu[*].appl.headerLength = 80 bit
*.rsu[*].appl.sendBeacons = false
*.rsu[*].appl.dataOnSch = false
*.rsu[*].appl.gatewayHost = "127.0.0.1"
*.rsu[*].appl.firstGatewayPort = 9001        # rsu[0] -> 9001 (GW-00), rsu[1] -> 9002, ...
*.rsu[*].appl.modelGatewayCpu = true
*.rsu[*].nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
# Attacker: parked next to rsu[0]                        #
##########################################################
*.eve.mobility.x = 2462
*.eve.mobility.y = 2050
*.eve.mobility.z = 1.5
*.eve.applType = "veyra.VeyraAttackerApp"
*.eve.appl.headerLength = 80 bit
*.eve.appl.sendBeacons = false
*.eve.appl.dataOnSch = false
*.eve.appl.targetRsu = 0
*.eve.appl.intruderAt = 5s
*.eve.appl.tamperAt = 10s
*.eve.appl.replayFreshAt = 12s
*.eve.appl.replayOldAt = 200s
*.eve.nic.phy80211p.antennaOffsetZ = 0 m

##########################################################
# 802.11p (same as the Veins Erlangen example)           #
##########################################################
*.connectionManager.sendDirect = true
*.connectionManager.maxInterfDist = 2600m
*.connectionManager.drawMaxIntfDist = false

*.**.nic.mac1609_4.useServiceChannel = false
*.**.nic.mac1609_4.txPower = 20mW
*.**.nic.mac1609_4.bitrate = 6Mbps
*.**.nic.phy80211p.minPowerLevel = -110dBm

*.**.nic.phy80211p.useNoiseFloor = true
*.**.nic.phy80211p.noiseFloor = -98dBm

*.**.nic.phy80211p.decider = xmldoc("config.xml")
*.**.nic.phy80211p.analogueModels = xmldoc("config.xml")
*.**.nic.phy80211p.usePropagationDelay = true

*.**.nic.phy80211p.antenna = xmldoc("antenna.xml", "/root/Antenna[@id='monopole']")
*.node[*].nic.phy80211p.antennaOffsetY = 0 m
*.node[*].nic.phy80211p.antennaOffsetZ = 1.895 m

##########################################################
# Vehicles                                               #
##########################################################
*.node[*].applType = "veyra.VeyraVehicleApp"
*.node[*].appl.headerLength = 80 bit
*.node[*].appl.sendBeacons = false
*.node[*].appl.dataOnSch = false
*.node[*].appl.maxVehicles = 20           # match gateway_service.py --vehicles
*.node[*].appl.compromisedIndex = 3       # node[3] reports 250+ km/h ...
*.node[*].appl.attackStart = 20s          # ... from 20 s after it enters the map
*.node[*].appl.fakeSpeedKmh = 250

*.node[*].veinsmobility.x = 0
*.node[*].veinsmobility.y = 0
*.node[*].veinsmobility.z = 0
*.node[*].veinsmobility.setHostSpeed = false

[Config Default]
description = "3 RSUs, 20 cars, all five attacks"

[Config NoAttacks]
description = "Honest traffic only: the clean baseline"
*.node[*].appl.compromisedIndex = -1
*.eve.appl.intruderAt = -1s
*.eve.appl.tamperAt = -1s
*.eve.appl.replayFreshAt = -1s
*.eve.appl.replayOldAt = -1s

[Config NoCpuModel]
description = "Gateway processing time ignored (radio delay only), for comparison"
*.rsu[*].appl.modelGatewayCpu = false

[Config AllCars]
description = "Every car SUMO inserts takes part (195 over the run); start gateway_service.py --vehicles 60"
*.node[*].appl.maxVehicles = -1

[Config ClassicalSizes]
description = "Same run, but handshake packets the size of a classical X25519 exchange (to isolate the cost of post-quantum sizes on the radio)"
*.node[*].appl.handshakeBytes = 64B
*.eve.appl.handshakeBytes = 64B

[Config ClassicalSizesNoCpuModel]
description = "ClassicalSizes + NoCpuModel: packet size is the only difference from NoCpuModel"
*.node[*].appl.handshakeBytes = 64B
*.eve.appl.handshakeBytes = 64B
*.rsu[*].appl.modelGatewayCpu = false
